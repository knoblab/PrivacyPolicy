<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인정보 처리방침 | Knoblab</title>

  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="mask-icon" href="/img/logo.svg" color="#556042">

  <meta property="og:title" content="개인정보 처리방침 | Knoblab">
  <meta property="og:description" content="Knoblab 서비스의 개인정보 처리방침입니다.">
  <meta property="og:image" content="https://login.knoblab.xyz/img/og.webp">
  <meta property="og:type" content="website">

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "IBM Plex Sans", "Pretendard Variable", Pretendard, sans-serif; }
    body {
      display: flex; justify-content: center;
      min-height: 100vh; background-color: #556042; color: #F7F6F2;
      padding: 48px 20px;
    }
    .doc-card {
      background: #F7F6F2; color: #2B2B2E;
      padding: 48px 44px; border: 1px solid #C2C1BB;
      width: 100%; max-width: 760px;
      height: fit-content;
    }
    .brand-header { display: flex; justify-content: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid #E7E6E1; }
    .brand-logo { height: 28px; width: auto; }

    .back-link {
      display: inline-flex; align-items: center; gap: 4px;
      color: #888783; text-decoration: none; font-size: 12px;
      margin-bottom: 24px;
    }
    .back-link:hover { color: #2B2B2E; }

    h1 { font-size: 22px; font-weight: 600; color: #2B2B2E; margin-bottom: 6px; }
    .effective-date { font-size: 12px; color: #888783; margin-bottom: 20px; }
    .intro { font-size: 13px; line-height: 1.7; color: #4A4A47; margin-bottom: 8px; }
    .intro-note { font-size: 12px; line-height: 1.6; color: #888783; background: #E7E6E1; border: 1px solid #C2C1BB; padding: 12px 14px; margin: 16px 0 32px; }

    h2 {
      font-size: 15px; font-weight: 600; color: #2B2B2E;
      margin: 36px 0 12px; padding-bottom: 8px;
      border-bottom: 1px solid #E7E6E1;
    }
    h2:first-of-type { margin-top: 0; }
    h3 { font-size: 13px; font-weight: 600; color: #2B2B2E; margin: 18px 0 8px; }

    p { font-size: 13px; line-height: 1.75; color: #3A3A38; margin-bottom: 10px; }
    ul, ol { font-size: 13px; line-height: 1.75; color: #3A3A38; margin: 8px 0 12px 20px; }
    li { margin-bottom: 4px; }
    li ul { margin-top: 4px; }
    strong { font-weight: 600; color: #2B2B2E; }
    a { color: #556042; }

    table { width: 100%; border-collapse: collapse; margin: 12px 0 18px; font-size: 12px; }
    th, td { border: 1px solid #C2C1BB; padding: 8px 10px; text-align: left; line-height: 1.5; }
    th { background: #E7E6E1; font-weight: 600; color: #2B2B2E; }
    td { color: #3A3A38; }

    .footnote { font-size: 12px; color: #888783; line-height: 1.7; margin: 6px 0; }

    .checklist-box {
      margin-top: 40px; padding: 16px 18px;
      background: #FBF6E8; border: 1px solid #D8C99A;
      font-size: 12px; line-height: 1.8; color: #6B5A2E;
    }
    .checklist-box p:first-child { font-weight: 600; margin-bottom: 6px; color: #6B5A2E; }
    .checklist-box ul { margin: 0 0 0 18px; color: #6B5A2E; }

    .telemetry-footer {
      margin-top: 32px; padding-top: 14px; border-top: 1px solid #E7E6E1;
      font-size: 10px; color: #888783; display: flex; justify-content: space-between;
    }

    hr { border: none; border-top: 1px solid #E7E6E1; margin: 28px 0; }

    @media (max-width: 600px) {
      .doc-card { padding: 32px 22px; }
    }

    /* New styles for version control and diffs */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #E7E6E1;
      padding: 12px 16px;
      border: 1px solid #C2C1BB;
      margin-bottom: 24px;
      font-size: 13px;
      border-radius: 4px;
    }
    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }
    .controls select {
      padding: 4px 8px;
      font-size: 13px;
      border: 1px solid #C2C1BB;
      border-radius: 4px;
      background: #fff;
      color: #2B2B2E;
      margin-left: 6px;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    #banner {
      display: none;
      background: #E8F4F8;
      border: 1px solid #B8DCE7;
      color: #2B5A6B;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
    }
    #banner:hover {
      background: #DDF0F6;
    }
    .diff-view {
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.7;
      color: #3A3A38;
      background: #fff;
      padding: 24px;
      border: 1px solid #C2C1BB;
      border-radius: 4px;
    }
    ins {
      background: #e6ffed;
      color: #1a7f37;
      text-decoration: none;
      padding: 2px 4px;
      border-radius: 3px;
    }
    del {
      background: #ffebe9;
      color: #cf222e;
      text-decoration: line-through;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .diff-header {
      font-weight: 600;
      margin-bottom: 16px;
      font-size: 14px;
      color: #2B2B2E;
      padding-bottom: 8px;
      border-bottom: 1px solid #E7E6E1;
    }
  </style>
</head>
<body>

<div class="doc-card">
  <div class="brand-header">
    <img src="/img/logo.svg" alt="Knoblab" class="brand-logo">
  </div>

  <a href="/" class="back-link">← 로그인으로 돌아가기</a>

  <div id="banner" onclick="showFutureUpdate()"></div>

  <div class="controls">
    <div>
      <label for="version-select">시행일자:
        <select id="version-select" onchange="onVersionChange()"></select>
      </label>
    </div>
    <label>
      <input type="checkbox" id="diff-checkbox" onchange="renderContent()"> 이전 버전과 비교
    </label>
  </div>

  <div id="policy-content">
    <p>로딩 중...</p>
  </div>

  <div class="telemetry-footer"><span>KNOBLAB © 2026</span></div>
</div>

<script>
  const versions = ['20260825'];
  let currentVersionDate = null;
  let serverDate = null;
  const htmlCache = {};

  async function init() {
    serverDate = await getServerDate();
    const currentDateInt = parseInt(formatDateToYYYYMMDD(serverDate), 10);

    let futureVersions = [];
    let pastOrCurrentVersions = [];

    versions.forEach(v => {
      if (parseInt(v, 10) > currentDateInt) {
        futureVersions.push(v);
      } else {
        pastOrCurrentVersions.push(v);
      }
    });

    // Sort descending
    pastOrCurrentVersions.sort((a, b) => b.localeCompare(a));
    futureVersions.sort((a, b) => a.localeCompare(b));

    const select = document.getElementById('version-select');
    pastOrCurrentVersions.forEach((v, index) => {
      const option = document.createElement('option');
      option.value = v;
      option.textContent = formatVersionLabel(v) + (index === 0 ? ' (현재)' : '');
      select.appendChild(option);
    });

    if (futureVersions.length > 0) {
      const nextUpdate = futureVersions[0];
      const banner = document.getElementById('banner');
      banner.textContent = `📢 예정된 업데이트가 있습니다. ${formatVersionLabel(nextUpdate)}부터 새로운 개인정보 처리방침이 시행될 예정입니다. (클릭하여 보기)`;
      banner.style.display = 'block';
      banner.dataset.version = nextUpdate;

      // Add future versions to select, marked as (예정)
      futureVersions.slice().reverse().forEach(v => {
        const option = document.createElement('option');
        option.value = v;
        option.textContent = formatVersionLabel(v) + ' (예정)';
        select.insertBefore(option, select.firstChild);
      });
    }

    // Determine default selected version (latest current)
    let defaultVersion = pastOrCurrentVersions.length > 0 ? pastOrCurrentVersions[0] : versions[versions.length - 1];
    select.value = defaultVersion;

    await renderContent();
  }

  window.showFutureUpdate = () => {
    const banner = document.getElementById('banner');
    const v = banner.dataset.version;
    document.getElementById('version-select').value = v;
    renderContent();
  };

  async function onVersionChange() {
    await renderContent();
  }

  async function fetchHtml(version) {
    if (htmlCache[version]) return htmlCache[version];
    try {
      const res = await fetch(`docs/${version}.html`);
      if (!res.ok) throw new Error('Failed to load');
      const text = await res.text();
      htmlCache[version] = text;
      return text;
    } catch (err) {
      console.error(err);
      return `<p>문서를 불러오는 중 오류가 발생했습니다.</p>`;
    }
  }

  async function renderContent() {
    const select = document.getElementById('version-select');
    const version = select.value;
    const showDiff = document.getElementById('diff-checkbox').checked;
    const container = document.getElementById('policy-content');

    container.innerHTML = '<p>로딩 중...</p>';

    const html = await fetchHtml(version);

    if (showDiff) {
      // Find the previous version
      const allSorted = versions.slice().sort();
      const currentIndex = allSorted.indexOf(version);

      if (currentIndex > 0) {
        const prevVersion = allSorted[currentIndex - 1];
        const prevHtml = await fetchHtml(prevVersion);

        const oldText = extractText(prevHtml);
        const newText = extractText(html);

        const diff = Diff.diffWords(oldText, newText);
        let diffHtml = '<div class="diff-view">';
        diffHtml += `<div class="diff-header">${formatVersionLabel(prevVersion)} 과(와) 비교</div>`;
        diff.forEach(part => {
          const text = part.value.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          if (part.added) {
            diffHtml += `<ins>${text}</ins>`;
          } else if (part.removed) {
            diffHtml += `<del>${text}</del>`;
          } else {
            diffHtml += text;
          }
        });
        diffHtml += '</div>';
        container.innerHTML = diffHtml;
      } else {
        container.innerHTML = '<div class="diff-view"><p>비교할 이전 버전이 없습니다.</p></div><br>' + html;
      }
    } else {
      container.innerHTML = html;
    }
  }

  function extractText(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    div.style.position = 'absolute';
    div.style.left = '-9999px';
    div.style.visibility = 'hidden';
    document.body.appendChild(div);
    const text = div.innerText || div.textContent;
    document.body.removeChild(div);
    return text.replace(/\n{3,}/g, '\n\n').trim();
  }

  async function getServerDate() {
    try {
      const res = await fetch(window.location.href, { method: 'HEAD' });
      const dateStr = res.headers.get('Date');
      if (dateStr) {
        return new Date(dateStr);
      }
    } catch (e) {
      console.error(e);
    }
    return new Date();
  }

  function formatDateToYYYYMMDD(date) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${yyyy}${mm}${dd}`;
  }

  function formatVersionLabel(v) {
    if (v.length === 8) {
      return `${v.substring(0,4)}년 ${parseInt(v.substring(4,6),10)}월 ${parseInt(v.substring(6,8),10)}일`;
    }
    return v;
  }

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
